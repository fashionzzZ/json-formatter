<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JSON Formatter - 专业JSON格式化工具</title>
  <link rel="stylesheet" href="lib/jsoneditor.min.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1 class="header-title">✨ JSON Formatter</h1>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
      <button id="formatBtn" class="btn btn-primary">
        <span class="icon">📋</span>
        <span>格式化</span>
      </button>
      <button id="compressBtn" class="btn btn-secondary">
        <span class="icon">📦</span>
        <span>压缩</span>
      </button>
      <button id="copyBtn" class="btn btn-secondary">
        <span class="icon">📄</span>
        <span>复制</span>
      </button>
    </div>

    <!-- Main Content -->
    <div class="main-content">
      <!-- Input Section -->
      <div class="input-section">
        <div class="input-label">📝 输入JSON数据</div>
        <textarea id="jsonInput" placeholder="粘贴您的JSON数据到这里..."></textarea>
      </div>

      <!-- Editor Section -->
      <div class="editor-section">
        <div class="editor-label">📊 格式化结果</div>
        <div class="editor-wrapper">
          <div id="jsoneditor"></div>
        </div>
      </div>
    </div>

    <!-- Status Bar -->
    <div class="status-bar">
      <div class="status-left">
        <span id="statusText">✅ 就绪</span>
      </div>
      <div class="status-right">
        <span id="jsonSize">大小: 0 bytes</span>
      </div>
    </div>

    <!-- Error Display -->
    <div id="errorDisplay" class="error-display">
      <span>⚠️</span>
      <span id="errorMessage"></span>
      <button id="errorDetailsBtn" class="btn-link">查看详情</button>
    </div>

    <!-- Toast Notification -->
    <div id="toast" class="toast"></div>
  </div>

  <script src="lib/jsoneditor.min.js"></script>
  <script src="popup.js"></script>
</body>
</html>
